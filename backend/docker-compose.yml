version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: hotel_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - hotel_net

  backend:
    build: ./backend
    container_name: hotel_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/hotel_management
      JWT_SECRET: change_this_in_production
      JWT_REFRESH_SECRET: change_this_too
      CLIENT_URL: http://localhost
    depends_on:
      - mongodb
    networks:
      - hotel_net

  frontend:
    build: ./frontend
    container_name: hotel_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - hotel_net

volumes:
  mongo_data:

networks:
  hotel_net:
    driver: bridge
