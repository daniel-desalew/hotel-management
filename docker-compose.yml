version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: hotel_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: hotel_management
    volumes:
      - mongo_data:/data/db
    networks:
      - hotel_net

  backend:
    build: ./backend
    container_name: hotel_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://admin:admin123@mongodb:27017/hotel_management?authSource=admin
      JWT_SECRET: change_this_in_production_use_random_string
      JWT_REFRESH_SECRET: change_this_too_use_random_string
      CLIENT_URL: http://localhost
    depends_on:
      - mongodb
    networks:
      - hotel_net

  frontend:
    build: ./frontend
    container_name: hotel_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - hotel_net

volumes:
  mongo_data:
    driver: local

networks:
  hotel_net:
    driver: bridge
